# pnpm reads settings here (no longer from the package.json "pnpm" field).
# Allow native install scripts to run: esbuild powers tsx; protobufjs is used
allowBuilds:
  esbuild: true
  protobufjs: true
  # The Prisma CLI fetches its schema engine (used by `db pull` / `migrate`) in
  # a postinstall. Dev-only: the API runs the committed client in src/generated.
  '@prisma/engines': true
  prisma: true
